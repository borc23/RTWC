stages:
  # Stage 1: Prepare data statistics and data.yaml if needed
  prepare:
    cmd: python ./src/prepare_data.py --data-dir ./data/
    deps:
    - ./src/prepare_data.py
    - ./data/
    outs:
    - ./outputs/data_stats.json

  train:
    cmd: python ./src/train.py --config ./configs/train_config.yaml 
      --wandb-project ${wandb_project} --metrics-output 
      ./outputs/train_metrics.json
    deps:
    - ./src/train.py
    - ./configs/train_config.yaml
    - ./data/data.yaml
    params:
    - training
    - slicing
    - augmentations
    - model
    outs:
    - ./runs/train/exp/weights/best.pt
    - ./runs/train/exp/weights/last.pt
    metrics:
    - ./outputs/train_metrics.json:
        cache: false

  # Stage 3: Evaluate
  evaluate:
    cmd: python ./src/evaluate.py --model ./runs/train/exp/weights/best.pt 
      --data ./data/data.yaml --config ./configs/train_config.yaml --output-dir 
      ./outputs
    deps:
    - ./src/evaluate.py
    - ./runs/train/exp/weights/best.pt
    - ./data/data.yaml
    params:
    - slicing
    metrics:
    - ./outputs/eval_metrics.json:
        cache: false
    plots:
    - ./outputs/eval/confusion_matrix.png
    - ./outputs/eval/PR_curve.png

  # Stage 4: Test inference (only if test data exists)
  test:
    cmd: python ./src/test.py --model ./runs/train/exp/weights/best.pt --data 
      ./data/data.yaml --config ./configs/train_config.yaml --output-dir 
      ./outputs --conf ${inference.conf_threshold}
    deps:
    - ./src/test.py
    - ./runs/train/exp/weights/best.pt
    - ./data/data.yaml
    params:
    - slicing
    - inference.conf_threshold
    outs:
    - ./outputs/predictions/labels
    metrics:
    - ./outputs/test_metrics.json:
        cache: false

# Variables (can be overridden via CLI)
vars:
- wandb_project: yolo-sliced-training
